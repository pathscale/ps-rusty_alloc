name: Publish

# House scheme: the version in Cargo.toml is the release, published only when crates.io lacks it.
# Manual only; releases are normally published locally after the merge.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the registry token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN is empty: gh secret set CARGO_REGISTRY_TOKEN --repo pathscale/ps-rusty_alloc"
            exit 1
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - run: cargo build --release
      # no_std on unix: multi-threaded, no cfg needed (docs/no_std.md).
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features debug_checks
      # The explicit single-thread opt-in still builds.
      - run: cargo check --no-default-features
        env:
          RUSTFLAGS: --cfg ra_single_threaded

      - name: Publish a missing version
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "ps-rusty_alloc") | .version')
          if cargo info --registry crates-io "ps-rusty_alloc@$version" > /dev/null 2>&1; then
            echo "ps-rusty_alloc $version is already on crates.io"
          else
            cargo publish --token "$CARGO_REGISTRY_TOKEN"
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
