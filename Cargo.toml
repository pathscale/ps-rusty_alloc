[package]
edition = "2024"
name = "ps-rusty_alloc"
version = "2.3.2"
authors = ["remade-with-rust", "PathScale"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A pure-Rust remake of mimalloc v2.4.5 (segments, free-list-sharded pages, lock-free cross-thread frees, heaps, arenas): pathscale fork of rusty_alloc."
readme = "README.md"
keywords = [
    "allocator",
    "malloc",
    "mimalloc",
    "memory",
    "no-std",
]
categories = [
    "memory-management",
    "no-std",
    "development-tools",
]
license = "MIT"
repository = "https://github.com/pathscale/ps-rusty_alloc"
resolver = "2"
exclude = ["bench", "tools"]

[features]
blockmap = []
debug_checks = []
default = ["std"]
linkcheck = []
profile = []
secure = []
std = ["dep:portable-atomic"]

[lib]
name = "rusty_alloc"
path = "src/lib.rs"

[[test]]
name = "abandon_rss"
path = "tests/abandon_rss.rs"

[[test]]
name = "adopt_large_spans"
path = "tests/adopt_large_spans.rs"

[[test]]
name = "alloc_core"
path = "tests/alloc_core.rs"

[[test]]
name = "corruption"
path = "tests/corruption.rs"

[[test]]
name = "double_free"
path = "tests/double_free.rs"

[[test]]
name = "foreign_free"
path = "tests/foreign_free.rs"

[[test]]
name = "heaps"
path = "tests/heaps.rs"

[[test]]
name = "huge_purge"
path = "tests/huge_purge.rs"

[[test]]
name = "large_cache"
path = "tests/large_cache.rs"

[[test]]
name = "loom_xthread"
path = "tests/loom_xthread.rs"

[[test]]
name = "openheimer"
path = "tests/openheimer.rs"

[[test]]
name = "options_env"
path = "tests/options_env.rs"

[[test]]
name = "prim"
path = "tests/prim.rs"

[[test]]
name = "prim_miri"
path = "tests/prim_miri.rs"

[[test]]
name = "properties"
path = "tests/properties.rs"

[[test]]
name = "region"
path = "tests/region.rs"

[[test]]
name = "rss_churn"
path = "tests/rss_churn.rs"

[[test]]
name = "secure"
path = "tests/secure.rs"

[[test]]
name = "span_packing"
path = "tests/span_packing.rs"

[[test]]
name = "spans"
path = "tests/spans.rs"

[[test]]
name = "stress_mt"
path = "tests/stress_mt.rs"

[[test]]
name = "teardown_reclaim"
path = "tests/teardown_reclaim.rs"

[[test]]
name = "thread_identity"
path = "tests/thread_identity.rs"

[dev-dependencies.loom]
version = "0.7"

[dev-dependencies.proptest]
version = "1"
features = ["std"]
default-features = false

[target.'cfg(not(target_has_atomic = "64"))'.dependencies.portable-atomic]
version = "1"
features = ["fallback"]
optional = true
default-features = false

[target."cfg(unix)".dependencies.libc]
version = "0.2"
default-features = false

[target."cfg(windows)".dependencies.windows-sys]
version = "0.60"
features = [
    "Win32_Foundation",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_Security_Cryptography",
]

[lints.clippy]
borrow_as_ptr = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_ptr_alignment = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
explicit_iter_loop = "allow"
inline_always = "allow"
iter_with_drain = "allow"
many_single_char_names = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
semicolon_if_nothing_returned = "allow"
single_match_else = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
undocumented_unsafe_blocks = "deny"
use_self = "allow"

[lints.clippy.nursery]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    "cfg(loom)",
    "cfg(kani)",
    "cfg(ra_small_profile)",
    "cfg(ra_single_threaded)",
    'cfg(ra_max_extents, values("8", "16", "64"))',
    "cfg(ra_aligned_region)",
    'cfg(ra_segment_size, values("256k"))',
    'cfg(ra_generic_collect, values("64", "4096", "65536"))',
    'cfg(ra_small_wsize, values("256", "512"))',
]
